services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dev_saas_backend
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dev_saas_backend']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: saas_db_test
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2026
      POSTGRES_DB: test_saas_backend
    ports:
      - '5436:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: saas_api
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - ./apps/api/.env

    environment:
      CHOKIDAR_USEPOLLING: true
      DATABASE_URL: ${DATABASE_URL}

    volumes:
      - ./apps:/app/apps
      - /app/apps/api/node_modules
      - ./apps/api/.env:/app/.env

    command: npx tsx watch --tsconfig apps/api/tsconfig.json apps/api/src/index.ts

    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: saas_email_worker
    restart: always
    env_file:
      - ./apps/api/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHOKIDAR_USEPOLLING: true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - ./apps/api/.env:/app/.env
    command: npx tsx watch --tsconfig apps/api/tsconfig.json apps/api/src/modules/jobs/workers/email.worker.ts
    depends_on:
      redis:
        condition: service_healthy

  worker-stripe:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development

    container_name: saas_worker_stripe

    env_file:
      - ./apps/api/.env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ./apps:/app/apps
      - /app/apps/api/node_modules
      - ./apps/api/.env:/app/.env

    command: npx tsx watch --tsconfig apps/api/tsconfig.json apps/api/src/modules/jobs/workers/stripe.worker.ts

    depends_on:
      redis:
        condition: service_healthy

  worker-analytics:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development

    container_name: saas_worker_analytics

    env_file:
      - ./apps/api/.env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ./apps:/app/apps
      - /app/apps/api/node_modules
      - ./apps/api/.env:/app/.env

    command: npx tsx watch --tsconfig apps/api/tsconfig.json apps/api/src/modules/jobs/workers/analytics.worker.ts

    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
