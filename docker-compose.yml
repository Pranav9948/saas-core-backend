services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dev_saas_backend
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dev_saas_backend']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: saas_db_test
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2026
      POSTGRES_DB: test_saas_backend
    ports:
      - '5436:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: saas_api
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - ./apps/api/.env.development

    environment:
      CHOKIDAR_USEPOLLING: true

    volumes:
      - ./apps:/app/apps
      - /app/apps/api/node_modules

    command: npx tsx watch --tsconfig apps/api/tsconfig.json apps/api/src/index.ts

    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: saas_mailhog
    restart: always
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: saas_notification_service
    restart: always
    env_file:
      - ./apps/notification-service/.env.development
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '4001:4001'
    volumes:
      - ./apps/notification-service:/app/apps/notification-service
      - /app/apps/notification-service/node_modules
    command: npx tsx apps/notification-service/src/index.ts
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:4001/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker-stripe:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development

    container_name: saas_worker_stripe

    env_file:
      - ./apps/api/.env.development

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ./apps:/app/apps
      - /app/apps/api/node_modules

    command: npx tsx watch --tsconfig apps/api/tsconfig.json apps/api/src/modules/jobs/workers/stripe.worker.ts

    depends_on:
      redis:
        condition: service_healthy

  worker-analytics:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development

    container_name: saas_worker_analytics

    env_file:
      - ./apps/api/.env.development

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ./apps:/app/apps
      - /app/apps/api/node_modules

    command: npx tsx watch --tsconfig apps/api/tsconfig.json apps/api/src/modules/jobs/workers/analytics.worker.ts

    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
