packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10.x (legacy allowlist)
onlyBuiltDependencies:
  - '@prisma/engines'
  - bcrypt
  - esbuild
  - msgpackr-extract
  - prisma
  - unrs-resolver

# pnpm 10.26+ / 11 (approve-builds). Latest `npm i -g pnpm` ignores package.json#pnpm.
allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
